kind = "mobile"
previewPath = "/soglom-apteka/"
title = "Sog‘lom Apteka Loyalty"
description = "Mobile-first Telegram-style loyalty and cashback app for Sog‘lom Apteka customers, with Uzbek as the primary language and Russian and English localization."
version = "1.0.0"
id = "artifacts/soglom-apteka"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/soglom-apteka/" ]
localPort = 24803

[services.development]
run = "pnpm --filter @workspace/soglom-apteka run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soglom-apteka", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/soglom-apteka", "run", "serve" ]

[services.env]
PORT = "24803"
BASE_PATH = "/soglom-apteka/"
