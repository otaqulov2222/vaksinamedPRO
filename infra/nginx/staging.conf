# Nginx Staging Configuration for VaksinaMed
# Reverse Proxy, SSL Termination & Healthcheck Routing

upstream api_upstream {
    server api:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP server — ACME challenge & HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.staging.vaksinamed.uz admin.staging.vaksinamed.uz _;

    # Certbot ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Allow local container healthcheck without HTTPS redirect
    location = /api/health/live {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — Staging API & Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.staging.vaksinamed.uz admin.staging.vaksinamed.uz;

    # SSL certificates (Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/staging.vaksinamed.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.vaksinamed.uz/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy buffers
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # API endpoints
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints
    location = /healthz {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Default fallback
    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
