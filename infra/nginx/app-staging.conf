# Nginx Virtual Host Configuration for VaksinaMed Mobile Web (Staging)
# Domain: app-staging.vaksinamedgps.uz
# Root: /var/www/vaksinamed-app-staging (Symlink to active release in /var/www/vaksinamed-app-releases/)

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name app-staging.vaksinamedgps.uz;

    # ACME Challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app-staging.vaksinamedgps.uz;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/app-staging.vaksinamedgps.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-staging.vaksinamedgps.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Web Root
    root /var/www/vaksinamed-app-staging;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        font/ttf
        font/otf
        image/svg+xml;

    # Font MIME Types & Headers
    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        types {
            font/ttf ttf;
            font/otf otf;
            font/woff woff;
            font/woff2 woff2;
            application/font-woff2 woff2;
            application/font-woff woff;
        }
    }

    # Static Assets (Images, Bundles, Chunks)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            font/ttf ttf;
            font/otf otf;
            font/woff woff;
            font/woff2 woff2;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/x-icon ico;
        }
    }

    # Expo Static JS Bundles
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            application/javascript js mjs;
            application/json json;
        }
    }

    # HTML Pages & SPA Fallback (Never cache HTML)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Protect hidden files except Let's Encrypt challenge
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
