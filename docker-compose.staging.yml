# VaksinaMed Staging Environment - Docker Compose Specification
#
# Production/Staging deployment on Hetzner Cloud.
# Security Invariants:
# 1. PostgreSQL 16 and Redis 7.2 are strictly isolated inside the private Docker bridge network.
#    NEVER publish 5432 or 6379 to host/public internet.
# 2. API and Worker execute under unprivileged user 'appuser' (UID 10001).
# 3. Nginx is the only service binding to host ports 80 and 443 with TLS termination.
# 4. Secrets are injected at runtime via .env.staging (never baked into images or committed).

name: vaksinamed-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaksinamed_staging
      POSTGRES_USER: ${POSTGRES_USER:-vaksinamed_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in staging environment}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks:
      - vaksinamed_staging_net
    # Port 5432 is intentionally NOT mapped to the host
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vaksinamed_staging_user} -d vaksinamed_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in staging environment}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - staging_redisdata:/data
    networks:
      - vaksinamed_staging_net
    # Port 6379 is intentionally NOT mapped to the host
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    environment:
      NODE_ENV: production
      APP_ENV: staging
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaksinamed_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/vaksinamed_staging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET required}
      CUSTOMER_SECRET: ${CUSTOMER_SECRET:?CUSTOMER_SECRET required}
      POS_SECRET: ${POS_SECRET:?POS_SECRET required}
      MERCHANT_SECRET_KEK: ${MERCHANT_SECRET_KEK:-}
      FOM_WEBHOOK_SECRET: ${FOM_WEBHOOK_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://admin.staging.vaksinamed.uz}
      ENABLE_BACKGROUND_WORKERS: "0"
      PAYME_MERCHANT_API_ENABLED: ${PAYME_MERCHANT_API_ENABLED:-0}
      CLICK_MERCHANT_API_ENABLED: ${CLICK_MERCHANT_API_ENABLED:-0}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      PG_POOL_MAX: 20
    networks:
      - vaksinamed_staging_net
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    command: ["node", "--enable-source-maps", "dist/worker.mjs"]
    environment:
      NODE_ENV: production
      APP_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaksinamed_staging_user}:${POSTGRES_PASSWORD}@postgres:5432/vaksinamed_staging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENABLE_BACKGROUND_WORKERS: "1"
      WORKER_POLL_INTERVAL_MS: "15000"
      WORKER_STALE_RUNNING_MS: "1800000"
      PG_POOL_MAX: 10
    networks:
      - vaksinamed_staging_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_certbot_www:/var/www/certbot:ro
      - staging_certbot_certs:/etc/letsencrypt:ro
    networks:
      - vaksinamed_staging_net
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  vaksinamed_staging_net:
    driver: bridge

volumes:
  staging_pgdata:
  staging_redisdata:
  staging_certbot_www:
  staging_certbot_certs:
